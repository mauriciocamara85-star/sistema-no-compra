<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VDH · No Compra</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #F7F8FA;
    --surface:  #FFFFFF;
    --surface2: #FFFFFF;
    --border:   #E6E8EC;
    --brite:    #D1D5DB;
    --acc:      #22C55E;
    --acc-a:    #DCFCE7;
    --acc-b:    rgba(34,197,94,.08);
    --txt:      #111827;
    --muted:    #9CA3AF;
    --dim:      #6B7280;
    --red:      #EF4444;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--txt); font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
  body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E"); opacity: .012; pointer-events: none; z-index: 0; }
  header { position: relative; z-index: 10; border-bottom: 1px solid var(--border); padding: 0 48px; height: 68px; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,.92); backdrop-filter: blur(12px); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .brand { display: flex; align-items: baseline; gap: 14px; }
  .brand-name { font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: 6px; color: var(--acc); line-height: 1; }
  .brand-sub { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
  .header-status { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 2px; color: var(--dim); display: flex; align-items: center; gap: 8px; }
  .dot-live { width: 6px; height: 6px; background: #22C55E; border-radius: 50%; box-shadow: 0 0 0 3px rgba(34,197,94,.2); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  .wrapper { position: relative; z-index: 1; flex: 1; display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 68px); }
  .sidebar { border-right: 1px solid var(--border); padding: 48px 36px; display: flex; flex-direction: column; gap: 40px; background: var(--surface); box-shadow: 2px 0 8px rgba(0,0,0,.04); }
  .sidebar-title { font-family: 'Bebas Neue', sans-serif; font-size: 52px; line-height: .9; letter-spacing: 2px; color: var(--txt); }
  .sidebar-title em { color: var(--acc); font-style: normal; display: block; }
  .sidebar-desc { font-size: 13px; color: var(--dim); line-height: 1.6; margin-top: 12px; }
  .field-req { margin-top: 32px; }
  .req-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--dim); font-family: 'DM Mono', monospace; }
  .req-dot { width: 5px; height: 5px; background: var(--acc); border-radius: 50%; flex-shrink: 0; }
  .req-dot.opt { background: var(--brite); }
  .form-area { padding: 48px 56px; overflow-y: auto; background: var(--bg); }
  .block-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .branch-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 40px; }
  .branch-btn { padding: 12px 8px; border: 1px solid #E5E7EB; background: #FFFFFF; color: #111827; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; transition: all .18s; line-height: 1.3; text-align: center; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .branch-btn:hover { border-color: #22C55E; color: #16A34A; background: #F0FDF4; box-shadow: 0 2px 6px rgba(34,197,94,.12); }
  .branch-btn.sel { border-color: #22C55E; background: #DCFCE7; color: #16A34A; box-shadow: 0 0 0 2px rgba(34,197,94,.2); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .fg { display: flex; flex-direction: column; gap: 8px; }
  .fg.span2 { grid-column: 1 / -1; }
  label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .rq { color: var(--acc); font-size: 14px; line-height: 1; }
  input[type=text], input[type=tel], input[type=email], textarea { width: 100%; background: #FFFFFF; border: 1px solid #E5E7EB; color: #111827; font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 13px 16px; outline: none; transition: border .18s, box-shadow .18s; -webkit-appearance: none; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  input:focus, textarea:focus { border-color: #22C55E; box-shadow: 0 0 0 3px rgba(34,197,94,.15); background: #FFFFFF; }
  input::placeholder, textarea::placeholder { color: #9CA3AF; font-size: 13px; }
  textarea { resize: vertical; min-height: 88px; line-height: 1.55; }
  .divider { height: 1px; background: var(--border); margin: 32px 0; position: relative; }
  .divider span { position: absolute; left: 0; top: -9px; background: var(--bg); padding: 0 12px 0 0; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px; color: var(--muted); }
  .submit-row { display: flex; align-items: center; gap: 20px; margin-top: 8px; }
  .btn-send { background: #22C55E; color: #FFFFFF; border: none; padding: 15px 48px; font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 4px; cursor: pointer; transition: all .18s; display: flex; align-items: center; gap: 10px; border-radius: 10px; box-shadow: 0 4px 12px rgba(34,197,94,.3); }
  .btn-send:hover { background: #16A34A; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(34,197,94,.35); }
  .btn-send:active { transform: translateY(0); }
  .btn-send:disabled { background: var(--brite); color: var(--muted); cursor: not-allowed; transform: none; box-shadow: none; }
  .send-hint { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  #feedback { display: none; margin-top: 20px; padding: 14px 20px; font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 1px; border-radius: 8px; }
  #feedback.ok { background: #DCFCE7; border: 1px solid #86EFAC; color: #16A34A; }
  #feedback.err { background: #FEE2E2; border: 1px solid #FCA5A5; color: #DC2626; }
  @media (max-width: 900px) {
    .wrapper { grid-template-columns: 1fr; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); padding: 32px 24px; }
    .form-area { padding: 32px 24px; }
    header { padding: 0 24px; }
    .branch-grid { grid-template-columns: repeat(2,1fr); }
    .form-grid { grid-template-columns: 1fr; }
    .fg.span2 { grid-column: 1; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-name">VDH</div>
    <div class="brand-sub">Sistema No Compra</div>
  </div>
  <div class="header-status">
    <div class="dot-live"></div>
    CONECTADO A SHEETS
  </div>
</header>

<div class="wrapper">
  <aside class="sidebar">
    <div>
      <div class="sidebar-title">NO<em>COMPRA</em></div>
      <p class="sidebar-desc">Registrá cada cliente que se fue sin llevar. El seguimiento es lo que convierte el "lo pienso" en venta.</p>
    </div>
    <div class="field-req">
      <div class="req-item"><div class="req-dot"></div> Sucursal</div>
      <div class="req-item"><div class="req-dot"></div> WhatsApp</div>
      <div class="req-item"><div class="req-dot"></div> Vendedor</div>
      <div class="req-item"><div class="req-dot opt"></div> Nombre</div>
      <div class="req-item"><div class="req-dot opt"></div> Mail</div>
      <div class="req-item"><div class="req-dot opt"></div> Producto</div>
      <div class="req-item"><div class="req-dot opt"></div> Talle</div>
      <div class="req-item"><div class="req-dot opt"></div> Observaciones</div>
    </div>
  </aside>

  <div class="form-area">
    <div class="block-label">SUCURSAL <span class="rq">*</span></div>
    <div class="branch-grid" id="branchGrid">
      <button class="branch-btn" data-v="MD2 - Mar del Plata Rivadavia" onclick="sel(this)">MD2<br>MDP Rivadavia</button>
      <button class="branch-btn" data-v="MDQ - Mar del Plata San Martin" onclick="sel(this)">MDQ<br>MDP San Martín</button>
      <button class="branch-btn" data-v="SPB - Shopping Parque Brown" onclick="sel(this)">SPB<br>Parque Brown</button>
      <button class="branch-btn" data-v="QUI - Quilmes" onclick="sel(this)">QUI<br>Quilmes</button>
      <button class="branch-btn" data-v="GRB - Grand Bourg" onclick="sel(this)">GRB<br>Grand Bourg</button>
      <button class="branch-btn" data-v="VPA - Villa del Parque" onclick="sel(this)">VPA<br>Villa del Parque</button>
      <button class="branch-btn" data-v="ITB - Ituzaingó Propio" onclick="sel(this)">ITB<br>Ituzaingó</button>
      <button class="branch-btn" data-v="MOR - Morón" onclick="sel(this)">MOR<br>Morón</button>
      <button class="branch-btn" data-v="FLO - Flores" onclick="sel(this)">FLO<br>Flores</button>
      <button class="branch-btn" data-v="SUN - Unicenter" onclick="sel(this)">SUN<br>Unicenter</button>
      <button class="branch-btn" data-v="SJU - San Justo I" onclick="sel(this)">SJU<br>San Justo I</button>
      <button class="branch-btn" data-v="SJB - San Justo Shopping" onclick="sel(this)">SJB<br>San Justo Shp.</button>
      <button class="branch-btn" data-v="PCH - Pacheco Propio" onclick="sel(this)">PCH<br>Pacheco</button>
      <button class="branch-btn" data-v="LZB - Lomas de Zamora BlackFish" onclick="sel(this)">LZB<br>Lomas Zamora</button>
      <button class="branch-btn" data-v="LFL - Laferrere Luro" onclick="sel(this)">LFL<br>Laferrere</button>
      <button class="branch-btn" data-v="LAN - Lanus" onclick="sel(this)">LAN<br>Lanús</button>
    </div>

    <div class="form-grid">
      <div class="fg">
        <label>Nombre cliente <span style="color:var(--muted);font-size:9px">(opcional)</span></label>
        <input type="text" id="f_nombre" placeholder="Ej: Martín G.">
      </div>
      <div class="fg">
        <label>WhatsApp <span class="rq">*</span></label>
        <input type="tel" id="f_wsp" placeholder="2236 123456">
      </div>
      <div class="fg span2">
        <label>Mail</label>
        <input type="email" id="f_mail" placeholder="cliente@mail.com">
      </div>
      <div class="fg">
        <label>Producto buscado</label>
        <input type="text" id="f_producto" placeholder="Ej: Hoodie, jean baggy, campera...">
      </div>
      <div class="fg">
        <label>Talle</label>
        <input type="text" id="f_talle" placeholder="Ej: M, L, XL, 32...">
      </div>
    </div>

    <div class="divider"><span>VENDEDOR · OBSERVACIONES</span></div>

    <div class="form-grid">
      <div class="fg span2">
        <label>Vendedor <span class="rq">*</span></label>
        <input type="text" id="f_vendedor" placeholder="Tu nombre">
      </div>
      <div class="fg span2">
        <label>Observaciones</label>
        <textarea id="f_obs" placeholder="Cualquier detalle útil para el seguimiento..."></textarea>
      </div>
    </div>

    <div class="submit-row">
      <button class="btn-send" id="btnSend" onclick="enviar()">GUARDAR <span>→</span></button>
      <div class="send-hint">Se guarda directo<br>en la planilla</div>
    </div>
    <div id="feedback"></div>
  </div>
</div>

<script>
  // Esta página se sirve desde GitHub Pages, fuera de Apps Script, así que
  // no existe google.script.run: le habla al backend de Google por POST.
  const API = 'https://script.google.com/macros/s/AKfycbxI373Id-FVEbyhErLlM5wvvyVApwdEBl2tmg_WfVgvXXpdy6ZgGDB0fGdHBQFHMVqu/exec';

  /**
   * El Content-Type va en text/plain a propósito: así el navegador manda el
   * POST directo. Con application/json pide permiso antes (preflight) y Apps
   * Script no responde a ese pedido, con lo cual la carga fallaría siempre.
   */
  async function llamar(cuerpo) {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(cuerpo)
    });
    if (!res.ok) throw new Error('El servidor respondió ' + res.status);
    return res.json();
  }

  let sucursal = '';

  function sel(btn) {
    document.querySelectorAll('.branch-btn').forEach(b => b.classList.remove('sel'));
    btn.classList.add('sel');
    sucursal = btn.dataset.v;
  }

  function mostrar(tipo, msg) {
    const el = document.getElementById('feedback');
    el.className = tipo;
    el.textContent = msg;
    el.style.display = 'block';
    if (tipo === 'ok') setTimeout(() => el.style.display = 'none', 4000);
  }

  async function enviar() {
    const wsp  = document.getElementById('f_wsp').value.trim();
    const vend = document.getElementById('f_vendedor').value.trim();
    if (!sucursal) { mostrar('err', '✕  Seleccioná la sucursal.'); return; }
    if (!wsp)      { mostrar('err', '✕  El WhatsApp es obligatorio.'); return; }
    if (!vend)     { mostrar('err', '✕  Ingresá el nombre del vendedor.'); return; }

    const btn = document.getElementById('btnSend');
    btn.disabled = true;
    btn.textContent = 'GUARDANDO...';

    const data = {
      sucursal,
      vendedor: vend,
      nombre:   document.getElementById('f_nombre').value.trim(),
      whatsapp: wsp,
      mail:     document.getElementById('f_mail').value.trim(),
      producto: document.getElementById('f_producto').value.trim(),
      talle:    document.getElementById('f_talle').value.trim(),
      obs:      document.getElementById('f_obs').value.trim(),
    };

    try {
      const res = await llamar({ accion: 'submit', datos: data });
      if (res.status === 'ok') {
        mostrar('ok', '✓  Registro guardado en la planilla correctamente.');
        resetForm();
      } else {
        mostrar('err', '✕  Error: ' + res.msg);
      }
    } catch (err) {
      mostrar('err', '✕  Error de conexión. Intentá de nuevo.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'GUARDAR <span>→</span>';
    }
  }

  function resetForm() {
    sucursal = '';
    document.querySelectorAll('.branch-btn').forEach(b => b.classList.remove('sel'));
    ['f_nombre','f_wsp','f_mail','f_obs','f_producto','f_talle','f_vendedor'].forEach(id => {
      document.getElementById(id).value = '';
    });
  }
</script>
</body>
</html>
