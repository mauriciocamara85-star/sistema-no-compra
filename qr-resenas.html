<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR de reseñas · VDH</title>
<meta name="robots" content="noindex">
<!--
  Los QR de reseñas para imprimir y poner en cada mostrador, uno por local.
  Es lo que mejor funciona para juntar reseñas: el vendedor lo muestra
  cuando el cliente paga, y el cliente la deja ahí mismo.

  Cada QR lleva al enlace de reseñas DE ESE LOCAL, el mismo que está
  cargado en Configuración → Club VDH → Reseñas en Google. Si un enlace
  cambia, se vuelve a imprimir desde acá.

  Se abre desde Configuración, con el PIN ya puesto (queda en la pestaña).
  Siempre en claro: es para papel.
-->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #EDEEF0; color: #16181B; font: 400 15px/1.5 'DM Sans', system-ui, sans-serif; padding: 24px 16px; }
  .barra { max-width: 820px; margin: 0 auto 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .barra h1 { font: 700 22px 'Space Grotesk', sans-serif; margin-right: auto; }
  .barra button, .barra a {
    border: 0; border-radius: 12px; padding: 11px 18px; cursor: pointer; text-decoration: none;
    font: 700 14px 'DM Sans', sans-serif;
  }
  .imprimir { background: linear-gradient(135deg, #B51222, #8E0E1B); color: #fff; }
  .volver { background: #fff; color: #16181B; border: 1px solid #DCDEE3 !important; }
  .aviso { max-width: 820px; margin: 0 auto 16px; color: #4A4F55; }
  .hojas { max-width: 820px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }

  /* Un cartel por local, del tamaño de media hoja A4: se corta al medio y
     entra en un portacartel de mostrador. */
  .cartel {
    background: #fff; border-radius: 18px; padding: 34px 28px 30px;
    text-align: center; border: 1px solid #DCDEE3;
    break-inside: avoid; page-break-inside: avoid;
  }
  .marca { font: 700 15px 'Space Grotesk', sans-serif; letter-spacing: 3px; color: #B51222; }
  .cartel h2 { font: 700 30px/1.1 'Space Grotesk', sans-serif; letter-spacing: -.6px; margin-top: 12px; }
  .estrellas { color: #FBBC04; font-size: 26px; letter-spacing: 4px; margin-top: 10px; }
  .qr { width: 220px; height: 220px; margin: 18px auto 14px; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .cartel p { font-size: 16px; color: #4A4F55; }
  .local { margin-top: 14px; font: 700 14px 'DM Sans', sans-serif; letter-spacing: 1.5px; text-transform: uppercase; color: #16181B; }

  @media print {
    body { background: #fff; padding: 0; }
    .barra, .aviso { display: none; }
    .hojas { display: block; max-width: none; }
    /* Dos por hoja A4, uno arriba del otro, con la línea de corte al medio. */
    @page { size: A4; margin: 12mm; }
    .cartel { height: 132mm; margin: 0 0 10mm; border: 1px dashed #BBB; border-radius: 0; }
  }
</style>
</head>
<body>

<div class="barra">
  <h1>QR de reseñas para los mostradores</h1>
  <a class="volver" href="config.html#club/resenas">Volver</a>
  <button type="button" class="imprimir" onclick="window.print()">Imprimir</button>
</div>
<p class="aviso" id="aviso">Buscando los locales…</p>
<div class="hojas" id="hojas"></div>

<script src="comun.js"></script>
<script src="datos.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var pin = '';
  try { pin = sessionStorage.getItem('nc_pin') || ''; } catch (e) {}

  if (!pin) {
    $('aviso').textContent = 'Abrí esta página desde Configuración → Club VDH, con el PIN puesto.';
    return;
  }

  function qrSvg(texto) {
    /* Corrección media (M): aguanta una mancha o un doblez del papel sin
       volverse ilegible, y el enlace entra con módulos grandes. */
    var q = qrcode(0, 'M');
    q.addData(texto);
    q.make();
    return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
  }

  base.club.resenasListar(pin).then(function (lista) {
    var conEnlace = (lista || []).filter(function (l) { return l.url; });
    var faltan = (lista || []).length - conEnlace.length;
    $('aviso').textContent = conEnlace.length
      ? conEnlace.length + ' carteles, dos por hoja.' +
        (faltan ? ' ' + faltan + ' locales todavía no tienen enlace y no aparecen: se cargan en Configuración.' : '')
      : 'Ningún local tiene cargado su enlace de reseñas todavía. Se cargan en Configuración → Club VDH.';
    $('hojas').innerHTML = conEnlace.map(function (l) {
      return '<div class="cartel">' +
        '<div class="marca">VDH</div>' +
        '<h2>¿Cómo te atendimos?</h2>' +
        '<div class="estrellas">★★★★★</div>' +
        '<div class="qr">' + qrSvg(l.url) + '</div>' +
        '<p>Escaneá y dejanos tu reseña en Google.<br>Nos ayuda a que más gente nos encuentre.</p>' +
        '<div class="local">VDH ' + esc(l.nombre) + '</div>' +
      '</div>';
    }).join('');
  }).catch(function (err) {
    $('aviso').textContent = (err && err.delServidor && err.message) || 'No se pudo abrir. Volvé a Configuración y poné el PIN.';
  });
})();
</script>
</body>
</html>
