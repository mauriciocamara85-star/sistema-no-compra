<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VDH · Beneficios</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F7F6F3">
<link rel="icon" href="icono-192.png">
<link rel="stylesheet" href="estilos.css">
<!-- Beneficios ya no es una sección (12/10/2026, reorganización del menú).
     Lo del mostrador (buscar, canjear, vender una Gift Card) está en
     Cobrar, y lo de la oficina (crear cupones, la lista, anular y
     extender) en el CRM, en "Cupones y Gift Cards".

     La dirección vieja sigue andando, porque está guardada en favoritos y
     en la app instalada de algunos aparatos: en uno de un local lleva a
     Cobrar y en uno de oficina (o sin local) al CRM. Con replace y no con
     un enlace, así "atrás" no vuelve a caer acá. -->
<script>
  (function () {
    var local = '', oficina = '';
    try {
      local = localStorage.getItem('nc_local') || '';
      oficina = localStorage.getItem('nc_oficina') || '';
      document.documentElement.dataset.theme = localStorage.getItem('nc_tema_club') === 'dark' ? 'dark' : 'light';
    } catch (e) {}
    location.replace(local && !oficina
      ? 'caja.html' + location.search + location.hash
      : 'panel.html' + location.search + '#cupones');
  })();
</script>
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--txt); font-family: var(--sans); }
  .mudanza { max-width: 420px; display: grid; gap: 12px; text-align: center; }
  .mudanza h1 { font: 700 20px/1.25 var(--display); }
  .mudanza p { font-size: 14.5px; line-height: 1.5; color: var(--txt-2); }
  .mudanza .btn { width: 100%; }
</style>
</head>
<body>
<!-- Lo que se ve si el desvío no corre (sin JavaScript, o un instante). -->
<main class="mudanza">
  <h1>Beneficios se mudó</h1>
  <p>Para cobrar, canjear o vender una Gift Card, andá a Cobrar. Los cupones y la lista de Gift Cards están en el CRM.</p>
  <a class="btn btn-pri" href="caja.html">Ir a Cobrar</a>
  <a class="btn btn-sec" href="panel.html#cupones">Ir al CRM: Cupones y Gift Cards</a>
</main>
</body>
</html>
