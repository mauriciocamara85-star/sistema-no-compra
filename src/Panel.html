<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VDH · No Compra · Seguimiento</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #F7F8FA;
    --surface: #FFFFFF;
    --border:  #E6E8EC;
    --brite:   #D1D5DB;
    --acc:     #22C55E;
    --txt:     #111827;
    --muted:   #9CA3AF;
    --dim:     #6B7280;
    --red:     #EF4444;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--txt); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

  header {
    border-bottom: 1px solid var(--border); padding: 0 48px; height: 68px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,.92); backdrop-filter: blur(12px);
    box-shadow: 0 1px 3px rgba(0,0,0,.06); position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: baseline; gap: 14px; }
  .brand-name { font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: 6px; color: var(--acc); line-height: 1; }
  .brand-sub { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
  .header-actions { display: flex; align-items: center; gap: 16px; }
  .whoami { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 1px; color: var(--dim); }
  .btn-ghost {
    background: none; border: 1px solid var(--border); color: var(--dim); cursor: pointer;
    font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    padding: 8px 14px; border-radius: 8px; transition: all .18s;
  }
  .btn-ghost:hover { border-color: var(--acc); color: var(--acc); background: #F0FDF4; }

  /* ── Pantalla de PIN ─────────────────────────────────────────── */
  .gate { max-width: 380px; margin: 100px auto; padding: 0 24px; text-align: center; }
  .gate-title { font-family: 'Bebas Neue', sans-serif; font-size: 52px; line-height: .9; letter-spacing: 2px; }
  .gate-title em { color: var(--acc); font-style: normal; display: block; }
  .gate-desc { font-size: 13px; color: var(--dim); line-height: 1.6; margin: 14px 0 32px; }
  .gate input {
    width: 100%; text-align: center; background: #fff; border: 1px solid #E5E7EB;
    font-family: 'DM Mono', monospace; font-size: 22px; letter-spacing: 10px;
    padding: 16px; border-radius: 10px; outline: none; transition: all .18s;
  }
  .gate input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(34,197,94,.15); }

  .btn-send {
    background: var(--acc); color: #fff; border: none; padding: 15px 48px;
    font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 4px;
    cursor: pointer; border-radius: 10px; box-shadow: 0 4px 12px rgba(34,197,94,.3);
    transition: all .18s; margin-top: 18px; width: 100%;
  }
  .btn-send:hover:not(:disabled) { background: #16A34A; transform: translateY(-1px); }
  .btn-send:disabled { background: var(--brite); color: var(--muted); cursor: not-allowed; box-shadow: none; transform: none; }

  /* ── Panel ───────────────────────────────────────────────────── */
  .wrap { max-width: 1180px; margin: 0 auto; padding: 36px 48px 80px; }

  .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 32px; }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .stat-n { font-family: 'Bebas Neue', sans-serif; font-size: 34px; line-height: 1; letter-spacing: 1px; }
  .stat-l { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  .stat.is-pend .stat-n { color: #D97706; }
  .stat.is-vend .stat-n { color: var(--acc); }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .fbtn {
    padding: 9px 16px; border: 1px solid #E5E7EB; background: #fff; color: var(--txt);
    font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.5px;
    text-transform: uppercase; cursor: pointer; border-radius: 8px; transition: all .18s;
  }
  .fbtn:hover { border-color: var(--acc); color: #16A34A; background: #F0FDF4; }
  .fbtn.sel { border-color: var(--acc); background: #DCFCE7; color: #16A34A; box-shadow: 0 0 0 2px rgba(34,197,94,.2); }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 24px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.04);
    display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: start;
  }
  .card-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .pill {
    font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 1.5px;
    text-transform: uppercase; padding: 4px 10px; border-radius: 20px;
  }
  .pill-suc { background: #F3F4F6; color: var(--dim); }
  .pill-est { border: 1px solid transparent; }
  .e-Pendiente   { background: #FEF3C7; color: #B45309; }
  .e-Contactado  { background: #DBEAFE; color: #1D4ED8; }
  .e-Vendido     { background: #DCFCE7; color: #15803D; }
  .e-Sinstock    { background: #FEE2E2; color: #B91C1C; }
  .e-Noresponde  { background: #F3F4F6; color: #4B5563; }
  .ago { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 1px; }
  .ago.viejo { color: var(--red); font-weight: 500; }

  .prod { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .prod .talle { color: var(--dim); font-weight: 400; font-size: 14px; }
  .meta { font-size: 13px; color: var(--dim); line-height: 1.7; }
  .meta b { color: var(--txt); font-weight: 500; }
  .obs { font-size: 13px; color: var(--dim); font-style: italic; margin-top: 8px; padding-left: 12px; border-left: 2px solid var(--border); }

  .contacto { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .lnk {
    font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    text-decoration: none; padding: 7px 14px; border-radius: 7px; transition: all .18s;
  }
  .lnk-wsp { background: #DCFCE7; color: #15803D; }
  .lnk-wsp:hover { background: var(--acc); color: #fff; }
  .lnk-mail { background: #F3F4F6; color: var(--dim); }
  .lnk-mail:hover { background: #E5E7EB; color: var(--txt); }

  .acciones { display: flex; flex-direction: column; gap: 6px; min-width: 132px; }
  .abtn {
    padding: 8px 12px; border: 1px solid #E5E7EB; background: #fff; cursor: pointer;
    font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 1.2px;
    text-transform: uppercase; border-radius: 7px; transition: all .18s; color: var(--dim);
  }
  .abtn:hover:not(:disabled) { border-color: var(--acc); color: #16A34A; background: #F0FDF4; }
  .abtn.activo { border-color: var(--acc); background: #DCFCE7; color: #15803D; }
  .abtn:disabled { opacity: .5; cursor: not-allowed; }

  .vacio { text-align: center; padding: 80px 20px; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 1px; }

  #feedback {
    display: none; position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    padding: 14px 24px; font-family: 'DM Mono', monospace; font-size: 12px;
    letter-spacing: 1px; border-radius: 10px; z-index: 50; box-shadow: 0 6px 20px rgba(0,0,0,.14);
  }
  #feedback.ok  { background: #DCFCE7; border: 1px solid #86EFAC; color: #16A34A; }
  #feedback.err { background: #FEE2E2; border: 1px solid #FCA5A5; color: #DC2626; }

  .hidden { display: none !important; }

  @media (max-width: 900px) {
    header { padding: 0 20px; }
    .wrap { padding: 24px 20px 60px; }
    .stats { grid-template-columns: repeat(3, 1fr); }
    .card { grid-template-columns: 1fr; }
    .acciones { flex-direction: row; flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-name">VDH</div>
    <div class="brand-sub">Seguimiento · No Compra</div>
  </div>
  <div class="header-actions hidden" id="hActions">
    <div class="whoami" id="whoami"></div>
    <button class="btn-ghost" onclick="cargar()">Actualizar</button>
    <button class="btn-ghost" onclick="salir()">Salir</button>
  </div>
</header>

<!-- ── PIN ──────────────────────────────────────────────────────── -->
<div class="gate" id="gate">
  <div class="gate-title">NO<em>COMPRA</em></div>
  <p class="gate-desc">Panel de seguimiento. Ingresá el PIN de Atención al Cliente.</p>
  <input type="password" id="pin" inputmode="numeric" placeholder="••••" maxlength="12"
         onkeydown="if(event.key==='Enter') entrar()">
  <button class="btn-send" id="btnEntrar" onclick="entrar()">ENTRAR</button>
</div>

<!-- ── Panel ────────────────────────────────────────────────────── -->
<div class="wrap hidden" id="app">
  <div class="stats" id="stats"></div>
  <div class="filters" id="filters"></div>
  <div id="lista"></div>
</div>

<div id="feedback"></div>

<script>
  var ESTADOS = ['Pendiente', 'Contactado', 'Vendido', 'Sin stock', 'No responde'];
  var pin = '';
  var filtro = 'Pendiente';
  var quien = '';

  // ── Almacenamiento local (puede fallar en modo privado) ─────────
  function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function leer(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function mostrar(tipo, msg) {
    var el = document.getElementById('feedback');
    el.className = tipo;
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(function () { el.style.display = 'none'; }, 3500);
  }

  // ── Ingreso ─────────────────────────────────────────────────────
  function entrar() {
    var v = document.getElementById('pin').value.trim();
    if (!v) { mostrar('err', '✕ Ingresá el PIN.'); return; }

    var btn = document.getElementById('btnEntrar');
    btn.disabled = true;
    btn.textContent = 'VERIFICANDO...';

    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        btn.textContent = 'ENTRAR';
        if (res.status !== 'ok') { mostrar('err', '✕ ' + res.msg); return; }

        pin = v;
        guardar('vdh_pin', v);
        quien = leer('vdh_quien');
        if (!quien) {
          quien = (prompt('¿Quién sos? (queda registrado en el seguimiento)') || '').trim();
          if (quien) guardar('vdh_quien', quien);
        }

        document.getElementById('gate').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        document.getElementById('hActions').classList.remove('hidden');
        document.getElementById('whoami').textContent = quien ? quien.toUpperCase() : '';

        pintarFiltros();
        cargar();
      })
      .withFailureHandler(function () {
        btn.disabled = false;
        btn.textContent = 'ENTRAR';
        mostrar('err', '✕ Error de conexión.');
      })
      .getResumen(v);
  }

  function salir() {
    pin = '';
    guardar('vdh_pin', '');
    document.getElementById('pin').value = '';
    document.getElementById('app').classList.add('hidden');
    document.getElementById('hActions').classList.add('hidden');
    document.getElementById('gate').classList.remove('hidden');
  }

  // ── Filtros ─────────────────────────────────────────────────────
  function pintarFiltros() {
    var opciones = ['Pendiente', 'Contactado', 'Vendido', 'Sin stock', 'No responde', 'Todos'];
    document.getElementById('filters').innerHTML = opciones.map(function (o) {
      return '<button class="fbtn' + (o === filtro ? ' sel' : '') +
             '" data-f="' + esc(o) + '">' + esc(o) + '</button>';
    }).join('');

    Array.prototype.forEach.call(document.querySelectorAll('.fbtn'), function (b) {
      b.onclick = function () { filtro = b.dataset.f; pintarFiltros(); cargar(); };
    });
  }

  // ── Carga de datos ──────────────────────────────────────────────
  function cargar() {
    document.getElementById('lista').innerHTML = '<div class="vacio">Cargando...</div>';

    google.script.run
      .withSuccessHandler(function (res) {
        if (res.status !== 'ok') { mostrar('err', '✕ ' + res.msg); return; }
        pintarLista(res.registros);
      })
      .withFailureHandler(function () { mostrar('err', '✕ Error de conexión.'); })
      .getRegistros(pin, filtro);

    google.script.run
      .withSuccessHandler(function (res) {
        if (res.status === 'ok') pintarStats(res.conteo);
      })
      .getResumen(pin);
  }

  function pintarStats(c) {
    var orden = [
      { k: 'Total',       cls: '' },
      { k: 'Pendiente',   cls: 'is-pend' },
      { k: 'Contactado',  cls: '' },
      { k: 'Vendido',     cls: 'is-vend' },
      { k: 'Sin stock',   cls: '' },
      { k: 'No responde', cls: '' }
    ];
    document.getElementById('stats').innerHTML = orden.map(function (o) {
      return '<div class="stat ' + o.cls + '">' +
             '<div class="stat-n">' + (c[o.k] || 0) + '</div>' +
             '<div class="stat-l">' + esc(o.k) + '</div></div>';
    }).join('');
  }

  function linkWsp(tel) {
    var n = String(tel).replace(/\D/g, '');
    if (n.indexOf('54') !== 0) n = '549' + n.replace(/^0/, '').replace(/^15/, '');
    return 'https://wa.me/' + n;
  }

  function pintarLista(regs) {
    if (!regs.length) {
      document.getElementById('lista').innerHTML =
        '<div class="vacio">No hay registros en «' + esc(filtro) + '»</div>';
      return;
    }

    document.getElementById('lista').innerHTML = regs.map(function (r) {
      var clsEstado = 'e-' + String(r.estado).replace(/\s/g, '');
      var antiguedad = r.dias === 0 ? 'hoy' : 'hace ' + r.dias + 'd';
      var alerta = (r.estado === 'Pendiente' && r.dias >= 3) ? ' viejo' : '';

      var botones = ESTADOS.map(function (e) {
        return '<button class="abtn' + (e === r.estado ? ' activo' : '') +
               '" data-fila="' + r.fila + '" data-estado="' + esc(e) + '">' + esc(e) + '</button>';
      }).join('');

      return '<div class="card">' +
        '<div>' +
          '<div class="card-head">' +
            '<span class="pill pill-suc">' + esc(r.sucursal) + '</span>' +
            '<span class="pill pill-est ' + clsEstado + '">' + esc(r.estado) + '</span>' +
            '<span class="ago' + alerta + '">' + esc(r.fecha) + ' · ' + antiguedad + '</span>' +
          '</div>' +
          '<div class="prod">' + esc(r.producto || 'Sin producto especificado') +
            (r.talle ? ' <span class="talle">· talle ' + esc(r.talle) + '</span>' : '') +
          '</div>' +
          '<div class="meta">' +
            (r.nombre ? '<b>' + esc(r.nombre) + '</b> · ' : '') +
            esc(r.whatsapp) + (r.mail ? ' · ' + esc(r.mail) : '') +
            '<br>Cargó <b>' + esc(r.vendedor) + '</b>' +
            (r.atendido ? ' · atendió <b>' + esc(r.atendido) + '</b>' : '') +
          '</div>' +
          (r.obs ? '<div class="obs">' + esc(r.obs) + '</div>' : '') +
          '<div class="contacto">' +
            '<a class="lnk lnk-wsp" target="_blank" href="' + linkWsp(r.whatsapp) + '">WhatsApp</a>' +
            (r.mail ? '<a class="lnk lnk-mail" href="mailto:' + esc(r.mail) + '">Mail</a>' : '') +
          '</div>' +
        '</div>' +
        '<div class="acciones">' + botones + '</div>' +
      '</div>';
    }).join('');

    Array.prototype.forEach.call(document.querySelectorAll('.abtn'), function (b) {
      b.onclick = function () { cambiar(b, +b.dataset.fila, b.dataset.estado); };
    });
  }

  // ── Cambio de estado ────────────────────────────────────────────
  function cambiar(btn, fila, estado) {
    Array.prototype.forEach.call(document.querySelectorAll('.abtn'), function (b) { b.disabled = true; });

    google.script.run
      .withSuccessHandler(function (res) {
        if (res.status === 'ok') { mostrar('ok', '✓ Marcado como ' + estado); cargar(); }
        else { mostrar('err', '✕ ' + res.msg); cargar(); }
      })
      .withFailureHandler(function () { mostrar('err', '✕ Error de conexión.'); cargar(); })
      .actualizarEstado(pin, fila, estado, quien);
  }

  // ── Sesión recordada ────────────────────────────────────────────
  (function () {
    var g = leer('vdh_pin');
    if (g) { document.getElementById('pin').value = g; entrar(); }
  })();
</script>
</body>
</html>
