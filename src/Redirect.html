<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VDH · No Compra</title>
<style>
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: #0B1220; color: #F8FAFC;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    text-align: center; padding: 24px;
  }
  .caja { max-width: 340px; }
  .punto {
    width: 46px; height: 46px; margin: 0 auto 18px;
    border-radius: 50%;
    border: 3px solid rgba(249, 115, 22, .25);
    border-top-color: #F97316;
    animation: girar .8s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  h1 { font-size: 19px; margin: 0 0 8px; }
  p { font-size: 14px; color: #CBD5E1; line-height: 1.55; margin: 0 0 20px; }
  a {
    display: inline-block;
    background: #F97316; color: #fff;
    padding: 13px 24px; border-radius: 12px;
    font-weight: 700; text-decoration: none;
  }
</style>
</head>
<body>
  <div class="caja">
    <div class="punto"></div>
    <h1>El sistema se mudó</h1>
    <p>Ahora abre más rápido y se puede instalar en el celular. Te estamos llevando…</p>
    <a id="ir" href="<?= destino ?>">Ir ahora</a>
  </div>

  <script>
    // La dirección se lee del propio botón en vez de imprimirla acá adentro:
    // el <?= ?> de Apps Script escapa para HTML, y dentro de un <script> eso
    // convertiría las comillas en &quot; y rompería la línea.
    var destino = document.getElementById('ir').href;

    // window.top y no window.location: esta página corre adentro del iframe de
    // Apps Script, y sin el .top el sitio cargaría dentro de ese marco.
    try { window.top.location.href = destino; }
    catch (e) { window.location.href = destino; }
  </script>
</body>
</html>
