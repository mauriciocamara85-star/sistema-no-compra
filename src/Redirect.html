<!DOCTYPE html>
<html lang="es">
<head>

<title>VDH · No Compra</title>
<style>
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: #0B1220; color: #F8FAFC;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    text-align: center; padding: 24px;
  }
  .caja { max-width: 360px; }
  .icono {
    width: 56px; height: 56px; margin: 0 auto 18px;
    border-radius: 17px;
    background: linear-gradient(160deg, #FB8B3C 0%, #EA580C 100%);
    display: grid; place-items: center;
    box-shadow: 0 10px 28px -10px rgba(249, 115, 22, .7);
  }
  .icono svg { width: 26px; height: 26px; }
  h1 { font-size: 21px; margin: 0 0 10px; letter-spacing: -.3px; }
  p { font-size: 14.5px; color: #CBD5E1; line-height: 1.55; margin: 0 0 22px; }
  a.ir {
    display: block;
    background: #F97316; color: #fff;
    padding: 16px 24px; border-radius: 13px;
    font-weight: 700; font-size: 16px; text-decoration: none;
  }
  .dir {
    margin-top: 18px;
    font-size: 12px; color: #94A3B8;
    word-break: break-all; line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="caja">
    <div class="icono">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>
    </div>
    <h1>El sistema se mudó</h1>
    <p>Ahora abre más rápido y se puede instalar en el celular.
       Tocá el botón y <b>guardate la dirección nueva</b>: este link viejo va a
       seguir trayéndote a esta pantalla.</p>

    <!-- target="_top" es obligatorio, no decorativo.
         Esta página corre dentro del iframe de Apps Script, que tiene
         sandbox="… allow-top-navigation-by-user-activation …". Eso significa
         que la pestaña entera sólo se puede navegar a partir de un clic real
         de la persona, nunca por código. Por eso acá no hay salto automático:
         no existe manera de hacerlo, y un spinner que gira para siempre sería
         menos honesto que un botón. Sin el target="_top", el clic cargaría el
         sitio adentro del marco de Google y la dirección de arriba seguiría
         siendo la vieja. -->
    <a class="ir" id="ir" target="_top" href="<?= destino ?>">Abrir el sistema</a>

    <div class="dir"><?= destino ?></div>
  </div>
</body>
</html>
