<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VDH Club</title>
<meta name="robots" content="noindex">
<!--
  El Club se mudó a vdhclub.com el 25/09/2026. Esto no se borra: hay tarjetas
  mandadas por WhatsApp con la dirección vieja, y algún teléfono puede tenerla
  agregada al inicio. Borrarla les daría un 404; esto los lleva al lugar
  correcto y se llevan el código que traían.

  El <script> redirige al instante. El <meta refresh> es la red de contención
  para un navegador con JavaScript apagado, y el enlace visible lo es para
  cuando fallan los dos.
-->
<meta http-equiv="refresh" content="1;url=https://vdhclub.com/">
<script>
  /* location.search y location.hash viajan con la redirección: sin eso, el
     cliente que abre su tarjeta pierde el ?c= con su código y aterriza en
     una pantalla que le pide el WhatsApp de nuevo. */
  location.replace('https://vdhclub.com/' + location.search + location.hash);
</script>
<style>
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: #EDEEF0; color: #16181B;
    font: 400 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center; padding: 24px;
  }
  a { color: #A00F1E; font-weight: 700; }
</style>
</head>
<body>
  <div>
    <p>El VDH Club se mudó.</p>
    <p><a href="https://vdhclub.com/">Entrá acá</a></p>
  </div>
</body>
</html>
