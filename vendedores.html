<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VDH · Vendedores</title>
<meta name="description" content="La app de los vendedores: el orden de los módulos con fotos, las tareas y los avisos.">
<meta name="theme-color" content="#0E1116">
<!-- Que el iPhone no convierta fechas y horas ("12/10", "18:00") en enlaces de teléfono azules -->
<meta name="format-detection" content="telephone=no, date=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-apple.png">
<link rel="icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ── La app de los vendedores (12/10/2026) ─────────────────────────────
     El diseño es el de "Módulo VDH - Pantallas", el que le gustó a Mauricio:
     fondo oscuro, acento lima, estilo iPhone y Manrope. No usa estilos.css
     a propósito: es otra paleta, y ese archivo lo comparten todas las demás
     pantallas. Sin la letra (sin señal) cae en la del sistema, y anda igual. */
  :root {
    --fondo: #0E1116;
    --tarjeta: #171C24;
    --borde: #252B35;
    --lima: #C6F432;
    --sobre-lima: #0E1116;
    --texto: #F4F5F7;
    --suave: #8B94A3;
    --verde: #5BD68A;
    --ambar: #F5B84B;
    --rojo: #FF8A8A;
    --barra: 64px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--fondo); color: var(--texto); }
  body {
    font: 16px/1.4 Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100svh;
  }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .app { max-width: 480px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 24px; }
  .app.con-barra { padding-bottom: calc(var(--barra) + 24px + env(safe-area-inset-bottom)); }

  h1 { font-size: 26px; font-weight: 800; margin: 8px 0 4px; letter-spacing: -.02em; }
  .bajada { color: var(--suave); margin: 0 0 20px; }
  .marca { display: flex; align-items: center; gap: 10px; color: var(--suave); font-weight: 700; font-size: 14px; }
  .marca b { color: var(--lima); }

  /* Las listas del login: botones grandes, uno por renglón */
  .lista { display: grid; gap: 10px; }
  .opcion {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 60px; padding: 14px 18px; border-radius: 16px;
    background: var(--tarjeta); border: 1px solid var(--borde);
    font-size: 18px; font-weight: 700; text-align: left; cursor: pointer;
  }
  .opcion:active { border-color: var(--lima); }
  .opcion::after { content: "›"; color: var(--suave); font-size: 26px; line-height: 1; }
  .volver { background: none; border: 0; color: var(--suave); padding: 10px 0; min-height: 44px; cursor: pointer; font-weight: 600; }

  /* El PIN */
  .puntos { display: flex; justify-content: center; gap: 18px; margin: 28px 0 10px; }
  .punto { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--suave); }
  .punto.lleno { background: var(--lima); border-color: var(--lima); }
  .puntos.esperando .punto.lleno { animation: latido 1s infinite; }
  .puntos.mal { animation: sacudir .35s; }
  @keyframes latido { 50% { opacity: .35; } }
  @keyframes sacudir { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  .aviso-pin { min-height: 44px; text-align: center; color: var(--suave); margin: 0 0 8px; }
  .aviso-pin.error { color: var(--rojo); }
  .teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 320px; margin: 0 auto; }
  .tecla {
    height: 64px; border-radius: 18px; border: 1px solid var(--borde); background: var(--tarjeta);
    font-size: 26px; font-weight: 700; cursor: pointer;
  }
  .tecla:active { background: var(--borde); }
  .tecla:disabled { opacity: .35; }
  .tecla.vacia { visibility: hidden; }
  .tecla.borrar { font-size: 22px; color: var(--suave); }

  /* Hoy */
  .cabeza { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .noesyo { background: none; border: 1px solid var(--borde); border-radius: 999px; color: var(--suave);
            padding: 0 14px; min-height: 44px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .resumen { background: var(--lima); color: var(--sobre-lima); border-radius: 22px; padding: 18px 20px; margin: 16px 0 24px; }
  .resumen .grande { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .resumen .chico { font-weight: 600; opacity: .8; }
  .progreso { height: 8px; border-radius: 99px; background: rgba(14, 17, 22, .18); margin: 12px 0 10px; overflow: hidden; }
  .progreso > i { display: block; height: 100%; background: var(--sobre-lima); border-radius: 99px; }
  .seccion { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--suave); margin: 22px 0 10px; }
  .modulo {
    display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border-radius: 16px;
    background: var(--tarjeta); border: 1px solid var(--borde); margin-bottom: 10px;
  }
  .modulo .que { flex: 1; min-width: 0; }
  .modulo .nombre { font-weight: 700; }
  .modulo .info { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
  .chip.listo { color: var(--verde); }
  .chip.corregir { color: var(--ambar); }
  .chip.sorpresa { color: var(--lima); }
  .chip.pendiente { color: var(--suave); }
  .chip.vencido { color: var(--rojo); }
  .chip.vence { color: var(--suave); border-color: transparent; padding-left: 0; }
  .camara {
    width: 52px; height: 52px; flex: none; border-radius: 14px; border: 0; cursor: pointer;
    background: var(--lima); color: var(--sobre-lima); display: grid; place-items: center;
  }
  .camara svg { width: 26px; height: 26px; }
  .modulo.hecho .camara { display: none; }
  .vacio { text-align: center; color: var(--suave); padding: 28px 12px; border: 1px dashed var(--borde); border-radius: 16px; }
  .nota { color: var(--suave); font-size: 14px; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; padding: 12px 14px; margin-top: 16px; }

  /* Perfil */
  .perfil { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 18px; padding: 18px; margin: 16px 0; }
  .perfil .nombre { font-size: 20px; font-weight: 800; }
  .boton {
    width: 100%; min-height: 52px; border-radius: 16px; border: 1px solid var(--borde);
    background: var(--tarjeta); font-weight: 700; cursor: pointer;
  }
  .boton.lima { background: var(--lima); color: var(--sobre-lima); border-color: var(--lima); }

  /* La barra de abajo */
  .barra {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: rgba(14, 17, 22, .94); backdrop-filter: blur(10px); border-top: 1px solid var(--borde);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .barra nav { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
  .pestana { height: var(--barra); background: none; border: 0; color: var(--suave); font-size: 12px; font-weight: 700;
             display: grid; place-items: center; align-content: center; gap: 3px; cursor: pointer; }
  .pestana svg { width: 24px; height: 24px; }
  .pestana.activa { color: var(--lima); }

  /* El cartelito de abajo */
  .cartel {
    position: fixed; left: 16px; right: 16px; bottom: calc(var(--barra) + 16px + env(safe-area-inset-bottom)); z-index: 6;
    max-width: 448px; margin: 0 auto; background: var(--texto); color: var(--fondo);
    border-radius: 14px; padding: 12px 16px; font-weight: 600; text-align: center;
  }
  .cargando { text-align: center; color: var(--suave); padding: 40px 0; }
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"><p class="cargando">Cargando…</p></main>
<div class="barra" id="barra" hidden>
  <nav>
    <button class="pestana" data-pestana="hoy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Hoy</button>
    <button class="pestana" data-pestana="tareas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h9"/></svg>Tareas</button>
    <button class="pestana" data-pestana="ideas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>Ideas</button>
    <button class="pestana" data-pestana="perfil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Perfil</button>
  </nav>
</div>
<div class="cartel" id="cartel" hidden></div>
<script src="datos.js"></script>
<script src="vendedores.js"></script>
</body>
</html>
