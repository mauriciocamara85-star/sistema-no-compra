<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VDH · No Compra · Seguimiento</title>
<meta name="description" content="Panel de seguimiento de los clientes que se fueron sin comprar.">
<meta name="theme-color" content="#0B1020">
<meta name="robots" content="noindex">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="No Compra">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<script>
  try {
    document.documentElement.dataset.theme =
      localStorage.getItem('nc_tema') === 'light' ? 'light' : 'dark';
  } catch (e) {}
</script>
<style>
  /* ── Sólo del panel ───────────────────────────────────────────────────── */
  :root { --tope: 860px; }

  /* Portón del PIN */
  .porton { max-width: 380px; margin: 8vh auto 0; padding: 0 20px; text-align: center; }
  .porton-icono {
    width: 62px; height: 62px; margin: 0 auto 18px;
    border-radius: 20px;
    background: linear-gradient(160deg, var(--acc) 0%, var(--acc-2) 100%);
    color: var(--acc-ink);
    display: grid; place-items: center;
    box-shadow: var(--glow);
  }
  .porton-icono svg { width: 28px; height: 28px; }
  .porton h2 { font: 700 27px/1.15 var(--display); letter-spacing: -.5px; }
  .porton p { font-size: 14.5px; color: var(--txt-2); margin: 10px 0 24px; }
  .porton input {
    text-align: center;
    font-size: 26px; font-weight: 700;
    letter-spacing: 12px; text-indent: 12px;
    padding: 16px 14px;
  }
  .porton .btn { margin-top: 12px; }

  /* El tablero de números (.kpis / .kpi) se mudó a estilos.css: ahora lo
     muestran esta pantalla y el formulario, y tener dos copias era garantía
     de que un día se vieran distintos. */

  /* Aviso de sistema: algo de fondo se rompió. Va ARRIBA de los números
     porque no es un dato más de la operación, es una cosa que hay que ir a
     arreglar. Sigue la forma de las tarjetas para no parecer un error del
     navegador. */
  .aviso {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--bad);
    border-radius: var(--r-sm);
    padding: 13px 14px;
    margin-bottom: 14px;
    box-shadow: var(--sombra);
    font-size: 13px;
    line-height: 1.5;
    color: var(--txt-2);
  }
  .aviso b { color: var(--bad-txt); display: block; margin-bottom: 3px; font-size: 13.5px; }
  .aviso-detalle {
    display: block;
    margin-top: 7px;
    padding-top: 7px;
    border-top: 1px solid var(--line);
    color: var(--txt-3);
    font-size: 11.5px;
    word-break: break-word;
  }

  /* Controles */
  .controles { margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
  .buscador { position: relative; }
  .buscador svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 17px; height: 17px; color: var(--txt-3); pointer-events: none;
  }
  .buscador input { padding-left: 42px; }
  /* Los dos selectores se apilan en pantallas angostas. Lado a lado en un
     celular quedan de ~180px y "Todos los locales" se corta a la mitad; no se
     achica la letra porque abajo de 16px iOS hace zoom solo al tocarlos. */
  .fila-filtros { display: flex; flex-direction: column; gap: 8px; }
  .fila-filtros select { flex: 1; min-width: 0; }
  @media (min-width: 480px) { .fila-filtros { flex-direction: row; } }

  /* La fila de estados scrollea de costado en el celular: son 6 y no entran.
     El degradé del borde derecho es lo que avisa que hay más: sin eso, con la
     barra de scroll oculta, nada indica que "Descartado" existe. */
  .filtros {
    display: flex; gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .filtros::-webkit-scrollbar { display: none; }
  /* La clase la pone marcarScroll() y sólo cuando queda algo afuera, así el
     degradé no se come el último filtro cuando ya se llegó al final. */
  .filtros.desborda {
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 30px), transparent 100%);
    mask-image: linear-gradient(to right, #000 calc(100% - 30px), transparent 100%);
  }
  .filtros .chip { flex: none; min-height: 38px; padding: 8px 14px; font-size: 13.5px; }
  .filtros .chip .cuenta {
    font-size: 11.5px; font-weight: 700;
    padding: 1px 7px; border-radius: var(--r-pill);
    background: var(--surface-3); color: var(--txt-2);
  }
  .filtros .chip.sel .cuenta { background: rgba(0, 0, 0, .22); color: var(--acc-ink); }

  /* Ficha de registro */
  .reg {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--line);
    border-radius: var(--r);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--sombra);
    animation: aparecer .35s var(--curva) backwards;
  }
  /* Pendiente con 3 días o más: se está por perder. */
  .reg.urgente { border-left-color: var(--bad); }
  .reg.es-pend { border-left-color: var(--warn); }
  .reg.es-cerrado { opacity: .78; }

  .reg-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 10px; }
  .reg-dias { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--txt-3); }
  .reg-dias.viejo { color: var(--bad-txt); }

  .reg-prod { font: 700 17.5px/1.3 var(--display); letter-spacing: -.2px; }
  .reg-prod .talle { font-size: 14px; color: var(--txt-2); font-weight: 500; font-family: var(--sans); }
  .reg-motivo {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 8px;
    padding: 5px 11px;
    border-radius: var(--r-pill);
    background: var(--acc-soft);
    color: var(--acc-txt);
    font-size: 13px; font-weight: 700;
  }
  .reg-cliente { margin-top: 10px; font-size: 14.5px; color: var(--txt); }
  .reg-cliente b { font-weight: 700; }
  .reg-cliente .tel { color: var(--txt-2); }
  .reg-meta { margin-top: 3px; font-size: 13px; color: var(--txt-2); }
  .reg-obs {
    margin-top: 10px;
    padding: 9px 12px;
    border-left: 2px solid var(--acc-line);
    background: var(--surface-2);
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    font-size: 13.5px; color: var(--txt-2);
  }
  .reg-acciones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

  .reg-seg { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 13px; }
  .seg-lbl { font-size: 12.5px; font-weight: 700; color: var(--txt-2); margin-bottom: 9px; }
  .seg-rapidos { display: flex; flex-wrap: wrap; gap: 7px; }
  .seg-rapidos .chip { min-height: 38px; padding: 8px 13px; font-size: 13px; }
  .seg-mas { margin-top: 12px; }
  .seg-toggle {
    font-size: 13px; font-weight: 700; color: var(--acc-txt);
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 0;
  }
  .seg-toggle svg { width: 14px; height: 14px; transition: transform .2s var(--curva); }
  .seg-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
  .seg-campos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .seg-campos .campo.ancho { grid-column: 1 / -1; }
  @media (max-width: 520px) { .seg-campos { grid-template-columns: 1fr; } }
  .seg-campos textarea { min-height: 62px; }

  /* ── En la PC de Atención al Cliente ───────────────────────────────────
     Las fichas pasan a dos columnas. Trabajando en una pantalla ancha, ver
     seis pendientes a la vez en lugar de dos cambia cómo se ataca la lista:
     se elige a quién escribir en vez de ir bajando de a uno.

     align-items:start deja que cada ficha mida lo suyo — una con
     observaciones larga no estira a la de al lado. */
  @media (min-width: 1100px) {
    :root { --tope: 1180px; }
    #lista {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: start;
    }
    .reg { margin-bottom: 0; }
    /* El vacío no se parte por la mitad: ocupa las dos columnas. */
    #lista > .vacio, #lista > .skel:nth-child(3) { grid-column: 1 / -1; }
  }
</style>
</head>
<body>

<header class="app-head">
  <div class="app-head-in">
    <div class="marca">
      <div class="marca-icono">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
      </div>
      <div class="marca-txt">
        <h1>Seguimiento</h1>
        <span id="whoami">VDH · No Compra</span>
      </div>
    </div>
    <div class="head-acciones">
      <button class="btn-icono" id="btnRefrescar" onclick="cargar()" title="Actualizar" aria-label="Actualizar" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg>
      </button>
      <button class="btn-icono" id="btnSalir" onclick="salir()" title="Salir" aria-label="Salir" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
      <div class="tema" role="group" aria-label="Tema visual">
        <button type="button" class="tema-btn" data-tema="dark" title="Tema oscuro" aria-label="Tema oscuro">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        </button>
        <button type="button" class="tema-btn" data-tema="light" title="Tema claro" aria-label="Tema claro">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </div>
</header>

<!-- ── Portón ── -->
<div class="porton" id="porton">
  <div class="porton-icono">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  </div>
  <h2>Panel de seguimiento</h2>
  <p>Acá están los teléfonos y mails de los clientes. Ingresá el PIN de Atención al Cliente.</p>
  <input type="password" id="pin" inputmode="numeric" placeholder="••••" maxlength="12"
         autocomplete="off" onkeydown="if(event.key==='Enter') entrar()">
  <button class="btn btn-pri btn-ancho" id="btnEntrar" onclick="entrar()">Entrar</button>
  <p class="pie" style="margin-top:22px">
    ¿Venías a cargar un cliente? <a href="index.html">Andá al formulario</a>
  </p>
</div>

<!-- ── Panel ──
     El rail aparece recién adentro: con el portón cerrado no hay nada que
     navegar, y la única salida útil de esa pantalla —volver al formulario—
     ya está escrita ahí abajo. -->
<div class="marco" id="marco" hidden>

<nav class="rail" aria-label="Secciones">
  <div class="rail-in">
    <a class="rail-item" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      Carga
    </a>
    <a class="rail-item" href="panel.html" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
      Panel
    </a>
    <a class="rail-item" href="config.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      Config.
    </a>
  </div>
</nav>

<main class="hoja" id="app">
  <div class="aviso" id="avisoCrm" hidden></div>
  <div class="kpis" id="kpis"></div>

  <div class="controles">
    <div class="buscador">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="busca" placeholder="Buscar por nombre, teléfono, producto o vendedor…" autocomplete="off">
    </div>
    <div class="fila-filtros">
      <select id="filtroLocal" aria-label="Filtrar por local"><option value="">Todos los locales</option></select>
      <select id="orden" aria-label="Orden">
        <option value="viejos">Más viejos primero</option>
        <option value="nuevos">Más nuevos primero</option>
      </select>
    </div>
    <div class="filtros" id="filtros"></div>
  </div>

  <div id="lista"></div>
</main>

</div><!-- /.marco -->

<div class="toast" id="toast"></div>

<script src="comun.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };

  var pin = '', filtro = 'Pendiente', quien = '', VOCAB = null;
  var registros = [], abiertos = {};

  var K_PIN = 'nc_pin', K_QUIEN = 'nc_quien';

  /* ═══ Ingreso ═══════════════════════════════════════════════════════════ */
  function entrar() {
    var v = $('pin').value.trim();
    if (!v) { avisar('err', 'Ingresá el PIN.'); return; }

    var btn = $('btnEntrar');
    btn.disabled = true; btn.textContent = 'Verificando…';

    llamar({ accion: 'resumen', pin: v })
      .then(function (res) {
        btn.disabled = false; btn.textContent = 'Entrar';
        if (res.status !== 'ok') { avisar('err', res.msg); return; }

        pin = v; VOCAB = res.vocab;
        guardar(K_PIN, v);

        quien = leer(K_QUIEN);
        if (!quien) {
          quien = (prompt('¿Quién sos? Queda anotado como responsable del seguimiento.') || '').trim();
          if (quien) guardar(K_QUIEN, quien);
        }

        $('porton').hidden = true;
        $('marco').hidden = false;
        $('btnRefrescar').hidden = false;
        $('btnSalir').hidden = false;
        $('whoami').textContent = quien ? 'VDH · ' + quien : 'VDH · No Compra';

        pintarKpis(res);
        pintarCrm(res);
        pintarFiltros(res.conteo);
        cargar();
      })
      .catch(function () {
        btn.disabled = false; btn.textContent = 'Entrar';
        avisar('err', 'Error de conexión.');
      });
  }

  function salir() {
    pin = ''; guardar(K_PIN, '');
    $('pin').value = '';
    $('marco').hidden = true;
    $('btnRefrescar').hidden = true;
    $('btnSalir').hidden = true;
    $('porton').hidden = false;
  }

  /* ═══ Tablero ═══════════════════════════════════════════════════════════
     Los cuatro números que contestan "¿esto sirve?": cuántos entraron, cuántos
     nadie tocó y —los que justifican el sistema entero— cuánta plata se
     recuperó de gente que ya se había ido sin comprar.

     La plata va partida en LOCAL y ONLINE a propósito. Un no-compra se
     resuelve de dos maneras: que el producto llegue al local y el cliente
     vuelva, o que se lo venda la tienda online. Sumarlas esconde justamente lo
     que hay que ver, que es cuánta venta le está empujando esto al ecommerce. */
  function pintarKpis(res) {
    var c = res.conteo || {};
    // El backend viejo devolvía un número suelto; el nuevo manda {local, online,
    // total}. Se aceptan los dos para que el panel no quede en blanco si alguna
    // vez se publica la interfaz antes que el backend.
    var rec = typeof res.recuperado === 'object' ? res.recuperado
                                                 : { total: res.recuperado || 0, local: 0, online: 0 };
    var com = typeof res.compraron === 'object' ? res.compraron
                                                : { total: res.compraron || 0, local: 0, online: 0 };
    var total = c.Total || 0;
    var tasa = total ? Math.round((com.total || 0) / total * 100) : 0;

    var clientes = function (n) { return n === 1 ? '1 cliente' : (n || 0) + ' clientes'; };

    var tarjetas = [
      { n: total, l: 'Registros', pie: tasa + '% terminó comprando', cls: '' },
      { n: c.Pendiente || 0, l: 'Sin tocar', pie: 'nadie los contactó', cls: 'es-pend' },
      { n: PESOS.format(rec.local || 0), l: 'Recuperado en el local',
        pie: clientes(com.local) + ' volvieron', cls: 'es-ok' },
      { n: PESOS.format(rec.online || 0), l: 'Recuperado online',
        pie: clientes(com.online) + ' compraron por la web', cls: 'es-plata' }
    ];

    $('kpis').innerHTML = tarjetas.map(function (t, i) {
      return '<div class="kpi ' + t.cls + '" style="animation-delay:' + (i * 40) + 'ms">' +
        '<div class="kpi-n">' + esc(t.n) + '</div>' +
        '<div class="kpi-l">' + esc(t.l) + '</div>' +
        '<div class="kpi-pie">' + esc(t.pie) + '</div></div>';
    }).join('');
  }

  /* El puente con Kommo se cae callado: un token vencido deja de crear leads y
     nadie se entera hasta que alguien va a buscar un cliente al CRM y no está.
     Si el backend avisa que la última sincronización falló, se ve acá arriba.
     No se muestra nada cuando el puente está apagado a propósito (todavía sin
     token) ni cuando anda bien: un cartel que está siempre no lo lee nadie. */
  function pintarCrm(res) {
    var crm = res.crm, caja = $('avisoCrm');
    if (!crm || !crm.activo || crm.ok) { caja.hidden = true; caja.innerHTML = ''; return; }

    var detalle = esc(crm.msg || 'Sin detalle.') + (crm.cuando ? ' · ' + esc(crm.cuando) : '');
    caja.innerHTML = '<b>Kommo no está recibiendo los registros.</b>' +
      'Los no-compra se siguen guardando y se ven acá, pero no están entrando al CRM. ' +
      'Lo más probable es que el token haya vencido.' +
      '<span class="aviso-detalle">' + detalle + '</span>';
    caja.hidden = false;
  }

  function pintarFiltros(conteo) {
    var ops = ['Pendiente'].concat(VOCAB.ESTADO).concat(['Todos']);
    $('filtros').innerHTML = ops.map(function (o) {
      var n = o === 'Todos' ? (conteo.Total || 0) : (conteo[o] || 0);
      return '<button type="button" class="chip' + (o === filtro ? ' sel' : '') + '" data-f="' + esc(o) + '">' +
             esc(o) + ' <span class="cuenta">' + n + '</span></button>';
    }).join('');
    marcarScroll();
    Array.prototype.forEach.call($('filtros').children, function (b) {
      b.onclick = function () {
        filtro = b.dataset.f;
        // Los pendientes se atacan del más viejo: son los que se están
        // por perder. En los demás estados interesa lo último que pasó.
        $('orden').value = filtro === 'Pendiente' ? 'viejos' : 'nuevos';
        pintarFiltros(conteo);
        cargar();
      };
    });
  }

  /* ═══ Carga ═════════════════════════════════════════════════════════════ */
  function cargar() {
    $('btnRefrescar').classList.add('girando');
    $('lista').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';

    llamar({ accion: 'registros', pin: pin, filtro: filtro })
      .then(function (res) {
        $('btnRefrescar').classList.remove('girando');
        if (res.status !== 'ok') { avisar('err', res.msg); return; }
        registros = res.registros || [];
        llenarLocales();
        pintar();
      })
      .catch(function () {
        $('btnRefrescar').classList.remove('girando');
        $('lista').innerHTML = '';
        avisar('err', 'Error de conexión.');
      });

    llamar({ accion: 'resumen', pin: pin })
      .then(function (res) { if (res.status === 'ok') { pintarKpis(res); pintarCrm(res); pintarFiltros(res.conteo); } })
      .catch(function () {});
  }

  function llenarLocales() {
    var actual = $('filtroLocal').value;
    var vistos = {};
    registros.forEach(function (r) { if (r.sucursal) vistos[r.sucursal] = 1; });
    var locales = Object.keys(vistos).sort();
    $('filtroLocal').innerHTML = '<option value="">Todos los locales</option>' +
      locales.map(function (l) {
        return '<option value="' + esc(l) + '"' + (l === actual ? ' selected' : '') + '>' + esc(bonito(l)) + '</option>';
      }).join('');
  }

  /* ═══ Lista ═════════════════════════════════════════════════════════════ */
  function visibles() {
    var q = $('busca').value.trim().toLowerCase();
    var loc = $('filtroLocal').value;
    var lista = registros.filter(function (r) {
      if (loc && r.sucursal !== loc) return false;
      if (!q) return true;
      return [r.nombre, r.whatsapp, r.producto, r.vendedor, r.mail, r.obs, r.motivo]
        .join(' ').toLowerCase().indexOf(q) > -1;
    });
    // El backend los manda del más nuevo al más viejo.
    if ($('orden').value === 'viejos') lista = lista.slice().reverse();
    return lista;
  }

  function antiguedad(r) {
    if (r.dias === null || r.dias === undefined) return '';
    if (r.dias === 0) return 'hoy';
    if (r.dias === 1) return 'ayer';
    return 'hace ' + r.dias + ' días';
  }

  /**
   * Mensaje ya escrito para WhatsApp. El vendedor lo puede editar antes de
   * mandarlo: wa.me abre el chat con el texto puesto, no lo envía solo.
   */
  function mensajeWsp(r) {
    var nombre = (r.nombre || '').trim().split(/\s+/)[0];
    var hola = nombre ? '¡Hola ' + nombre + '! ' : '¡Hola! ';
    var donde = r.sucursal ? ' de VDH ' + bonito(r.sucursal) : ' de VDH';
    var que = r.producto
      ? 'Pasaste por el local buscando ' + r.producto.toLowerCase().trim() + ' y no lo pudimos resolver en el momento.'
      : 'Pasaste por el local y no encontraste lo que buscabas.';
    return hola + 'Te escribo' + donde + '. ' + que + ' Tengo novedades para mostrarte, ¿te paso fotos?';
  }

  function opciones(lista, actual) {
    return '<option value=""></option>' + lista.map(function (o) {
      return '<option value="' + esc(o) + '"' + (o === actual ? ' selected' : '') + '>' + esc(o) + '</option>';
    }).join('');
  }

  function pintar() {
    var lista = visibles();

    if (!lista.length) {
      $('lista').innerHTML =
        '<div class="vacio"><div class="vacio-icono">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>' +
        '</div><b>No hay nada acá</b><span>Probá con otro filtro o limpiá la búsqueda.</span></div>';
      return;
    }

    $('lista').innerHTML = lista.map(function (r, i) {
      var pendiente = !r.estado && String(r.contactamos).toLowerCase() !== 'si';
      var urgente = pendiente && r.dias !== null && r.dias >= 3;
      var cerrado = r.estado && r.estado.indexOf('Cerrado') === 0;
      var abierto = !!abiertos[r.fila];

      var clase = 'reg' + (urgente ? ' urgente' : (pendiente ? ' es-pend' : '')) + (cerrado ? ' es-cerrado' : '');

      var estadoPill = r.estado
        ? '<span class="pill ' + (r.estado === 'Cerrado - compró' ? 'pill-ok'
            : r.estado === 'Cerrado - no compró' || r.estado === 'Descartado' ? 'pill-neutra' : 'pill-info') +
          '">' + esc(r.estado) + '</span>'
        : (pendiente ? '<span class="pill pill-warn">Pendiente</span>' : '');

      var rapidos = VOCAB.RESULTADO_1.map(function (o) {
        return '<button type="button" class="chip' + (o === r.resultado1 ? ' sel' : '') +
               '" data-fila="' + r.fila + '" data-res="' + esc(o) + '">' + esc(o) + '</button>';
      }).join('');

      return '<article class="' + clase + '" data-fila="' + r.fila + '" style="animation-delay:' + Math.min(i * 30, 300) + 'ms">' +
        '<div class="reg-top">' +
          '<span class="pill pill-neutra">' + esc(bonito(r.sucursal) || 'Sin local') + '</span>' +
          estadoPill +
          '<span class="reg-dias' + (urgente ? ' viejo' : '') + '">' + esc(antiguedad(r)) + '</span>' +
        '</div>' +

        '<h3 class="reg-prod">' + esc(r.producto || 'Sin producto anotado') +
          (r.talle ? ' <span class="talle">· talle ' + esc(r.talle) + '</span>' : '') + '</h3>' +

        (r.motivo ? '<div class="reg-motivo">' + esc(r.motivo) + '</div>' : '') +

        '<div class="reg-cliente">' +
          (r.nombre ? '<b>' + esc(r.nombre) + '</b> · ' : '') +
          '<span class="tel">' + esc(r.whatsapp) + '</span>' +
          (r.mail ? ' · <span class="tel">' + esc(r.mail) + '</span>' : '') +
        '</div>' +

        '<div class="reg-meta">' + esc(r.fecha) + ' · cargó <b>' + esc(r.vendedor || '—') + '</b>' +
          (r.responsable ? ' · sigue <b>' + esc(r.responsable) + '</b>' : '') +
          (r.fecha1 ? ' · 1er contacto ' + esc(r.fecha1) : '') + '</div>' +

        (r.obs ? '<div class="reg-obs">' + esc(r.obs) + '</div>' : '') +

        '<div class="reg-acciones">' +
          '<a class="btn btn-wsp btn-chico" target="_blank" rel="noopener" href="' + esc(linkWsp(r.whatsapp, mensajeWsp(r))) + '">' +
            '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.5-.6-2.7-1.2-4.4-3.9-4.6-4.1-.1-.2-1-1.4-1-2.6 0-1.2.6-1.8.9-2 .2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 1.9c.1.2.1.3 0 .5l-.4.5-.3.3c-.1.1-.2.3 0 .5.1.3.6 1.1 1.4 1.7 1 .8 1.7 1.1 2 1.2.2.1.4.1.5-.1l.7-.8c.2-.2.3-.2.5-.1l1.8.9c.2.1.4.2.4.3.1.1.1.6-.1 1.2Z"/></svg>' +
            'WhatsApp</a>' +
          '<a class="btn btn-sec btn-chico" target="_blank" rel="noopener" href="' + esc(linkWsp(r.whatsapp, '')) + '">Chat en blanco</a>' +
          (r.mail ? '<a class="btn btn-sec btn-chico" href="mailto:' + esc(r.mail) + '">Mail</a>' : '') +
        '</div>' +

        '<div class="reg-seg">' +
          '<div class="seg-lbl">¿Cómo salió el primer contacto?</div>' +
          '<div class="seg-rapidos">' + rapidos + '</div>' +
          '<div class="seg-mas">' +
            '<button type="button" class="seg-toggle" data-fila="' + r.fila + '" aria-expanded="' + abierto + '">' +
              'Estado, compra y notas ' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>' +
            '</button>' +
            '<div class="seg-campos"' + (abierto ? '' : ' hidden') + '>' +
              '<div class="campo"><label>Estado actual</label>' +
                '<select data-c="estado">' + opciones(VOCAB.ESTADO, r.estado) + '</select></div>' +
              '<div class="campo"><label>¿Compró?</label>' +
                '<select data-c="compro">' + opciones(VOCAB.COMPRO, r.compro) + '</select></div>' +
              '<div class="campo ancho"><label>Notas del seguimiento</label>' +
                '<textarea data-c="obsSeguim" placeholder="Qué dijo, qué quedó pendiente…">' + esc(r.obsSeguim) + '</textarea></div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</article>';
    }).join('');

    conectar();
  }

  /* ═══ Guardado ══════════════════════════════════════════════════════════ */
  function conectar() {
    // Resultado del 1er contacto: un toque deja marcado contacto, fecha,
    // responsable y resultado, que es lo que antes se cargaba a mano.
    Array.prototype.forEach.call(document.querySelectorAll('.seg-rapidos .chip'), function (b) {
      b.onclick = function () {
        guardarSeguim(+b.dataset.fila, {
          contactamos: 'si',
          responsable: quien,
          fecha1: hoyDDMM(),
          resultado1: b.dataset.res
        }, 'Anotado: ' + b.dataset.res);
      };
    });

    Array.prototype.forEach.call(document.querySelectorAll('.seg-toggle'), function (b) {
      b.onclick = function () {
        var campos = b.parentNode.querySelector('.seg-campos');
        var abierto = campos.hidden;
        campos.hidden = !abierto;
        b.setAttribute('aria-expanded', String(abierto));
        abiertos[b.dataset.fila] = abierto;
      };
    });

    Array.prototype.forEach.call(document.querySelectorAll('.reg select'), function (s) {
      s.onchange = function () {
        var campos = {};
        campos[s.dataset.c] = s.value;
        if (quien) campos.responsable = quien;
        guardarSeguim(+s.closest('.reg').dataset.fila, campos, 'Guardado');
      };
    });

    Array.prototype.forEach.call(document.querySelectorAll('.reg textarea'), function (t) {
      var original = t.value;
      t.onblur = function () {
        if (t.value === original) return;
        original = t.value;
        var campos = {};
        campos[t.dataset.c] = t.value;
        guardarSeguim(+t.closest('.reg').dataset.fila, campos, 'Nota guardada', true);
      };
    });
  }

  function hoyDDMM() {
    var d = new Date();
    return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2);
  }

  /** Prende el degradé del borde derecho sólo mientras queden filtros afuera. */
  function marcarScroll() {
    var f = $('filtros');
    f.classList.toggle('desborda', f.scrollLeft + f.clientWidth < f.scrollWidth - 2);
  }

  function guardarSeguim(fila, campos, msgOk, sinRecargar) {
    llamar({ accion: 'seguimiento', pin: pin, fila: fila, campos: campos })
      .then(function (res) {
        if (res.status === 'ok') {
          avisar('ok', msgOk);
          if (!sinRecargar) cargar();
        } else {
          avisar('err', res.msg);
          cargar();
        }
      })
      .catch(function () { avisar('err', 'No se pudo guardar. Revisá la conexión.'); });
  }

  /* ═══ Arranque ══════════════════════════════════════════════════════════ */
  (function () {
    iniciarTema();

    var t = null;
    $('busca').oninput = function () { clearTimeout(t); t = setTimeout(pintar, 180); };
    $('filtroLocal').onchange = pintar;
    $('orden').onchange = pintar;
    $('filtros').onscroll = marcarScroll;
    window.addEventListener('resize', marcarScroll);

    var guardadoPin = leer(K_PIN);
    if (guardadoPin) { $('pin').value = guardadoPin; entrar(); }

    iniciarPWA();
  })();
</script>
</body>
</html>
